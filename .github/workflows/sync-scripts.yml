# sync-scripts.yml — keep a module's scripts/ current with the module template
#
# Purpose:   "Use this template" copies scripts/ once and nothing updates it, so
#            the convention checker, bootstrap and publication helpers of every
#            module drift from mii-kds-module-template. This workflow refreshes
#            them and opens a PR when they drift, and fails a PR whose copy is
#            stale — the same mechanism sync-ig-template.yml provides for the
#            vendored IG template.
# Triggers:  weekly schedule (Mondays 05:30 UTC), manual workflow_dispatch, and
#            pull_request (drift CHECK only — never writes on a PR).
# Toggle:    vars.ENABLE_SCRIPT_SYNC — ON by default; set the repo variable to
#            'false' to disable (jobs then skip, which is expected, not an error).
# Scope:     skipped in the template repository itself (its scripts/ IS the source).
# Gated:     never auto-merges. Drift always lands as a reviewable PR.
name: Sync template scripts

on:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC
  workflow_dispatch:
  pull_request:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-scripts
  cancel-in-progress: false

jobs:
  check:
    if: ${{ vars.ENABLE_SCRIPT_SYNC != 'false' && github.event_name == 'pull_request' && github.repository != 'medizininformatik-initiative/mii-kds-module-template' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check scripts/ against mii-kds-module-template@main
        run: bash scripts/sync-scripts.sh --check --ref main

  sync:
    if: ${{ vars.ENABLE_SCRIPT_SYNC != 'false' && github.event_name != 'pull_request' && github.repository != 'medizininformatik-initiative/mii-kds-module-template' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh scripts/ from mii-kds-module-template@main
        run: bash scripts/sync-scripts.sh --ref main
      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard scripts)" ]; then
            echo "::notice::scripts/ already current — nothing to do."
            exit 0
          fi
          src_sha="$(sed -n 's/^commit: //p' scripts/.template-sync | head -1)"
          branch="chore/sync-scripts-${src_sha:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add scripts
          git commit -m "chore: sync scripts/ with mii-kds-module-template@${src_sha:0:7}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${branch}"
          {
            printf 'The module template moved on. This refreshes the propagated tooling in `scripts/` from `mii-kds-module-template@main` (`%s`).\n\n' "${src_sha}"
            printf 'Generated by `.github/workflows/sync-scripts.yml` via `scripts/sync-scripts.sh`. Run `node --test scripts/*.test.mjs` and `node scripts/convention-check.mjs` before merging.\n'
          } > "${RUNNER_TEMP}/pr-body.md"
          gh pr create --base dev --head "${branch}" \
            --title "chore: sync template scripts (${src_sha:0:7})" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
