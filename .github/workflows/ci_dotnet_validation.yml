# Reusable workflow: SUSHI compile + Simplifier Quality Control (.NET).
#
# Purpose:   Compile the module's FSH with SUSHI and run Firely Terminal's .NET
#            validator plus the Simplifier Quality Control rules in qc/custom
#            (MII naming conventions). The .NET validation is configured as an
#            EXPECTED fail, so this job always passes: read its log for the
#            findings. On pull requests it commits fsh-generated/resources back
#            to the PR branch.
#
# Callers:   the validation workflows of KDS modules, as
#              uses: medizininformatik-initiative/mii-kds-module-template/.github/workflows/ci_dotnet_validation.yml@<commit-SHA> # vX.Y.Z
#            Pin a commit SHA of a tagged release of this repository, never a
#            branch. Earlier pins to kerndatensatz-meta@master keep resolving
#            (those commits stay reachable); new pins point here.
#
# Origin:    moved from kerndatensatz-meta@master (last change 54fd89c4, see
#            kerndatensatz-meta#251). The inputs and secrets contract is
#            unchanged, so a caller only swaps the `uses:` path. Changes in the
#            move: third-party actions pinned to commit SHAs.
#
# Additions: optional inputs, so existing callers behave as before.
#            - SNAPSHOT_DEPENDENCIES (default true): install the dependency
#              packages and generate their snapshots with Gefyra/fhir-pkg-tool
#              before SUSHI runs (#52). Differential-only packages (ISiK)
#              otherwise make SUSHI fail with "... is missing a snapshot".
#            - ZTS_ACCEPTED_DOWNLOAD_CONDITIONS / ZTS_PACKAGES: packages that
#              exist only on the BfArM ZTS are installed into the package cache
#              by .github/actions/zts-packages before fhir-pkg-tool and SUSHI.
#              Callers pass vars.ZTS_ACCEPTED_DOWNLOAD_CONDITIONS and
#              vars.ZTS_PACKAGES; empty inputs are a no-op (#55).
#
# Bootstrap: a module created from this template does NOT keep this file
#            (first-run-bootstrap.sh REMOVE=); modules call the copy here.
#
# Secrets:   SIMPLIFIER_USERNAME / SIMPLIFIER_PASSWORD (Simplifier login for QC).
name: CI DOTNET FHIR Validation

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      SUSHI_VERSION:
        required: true
        type: string
      SNAPSHOT_DEPENDENCIES:
        description: 'Install the dependency packages and generate their snapshots with Gefyra/fhir-pkg-tool before SUSHI runs (fixes "... is missing a snapshot" from differential-only packages such as ISiK).'
        default: true
        required: false
        type: boolean
      ZTS_ACCEPTED_DOWNLOAD_CONDITIONS:
        description: 'Package names whose BfArM ZTS download conditions are accepted (pass vars.ZTS_ACCEPTED_DOWNLOAD_CONDITIONS). Needed only for dependencies that exist solely on the ZTS.'
        default: ''
        required: false
        type: string
      ZTS_PACKAGES:
        description: 'Additional ZTS-only packages as name#version, comma-separated, for transitive needs (pass vars.ZTS_PACKAGES).'
        default: ''
        required: false
        type: string
    secrets:
      SIMPLIFIER_USERNAME:
        required: true
      SIMPLIFIER_PASSWORD:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      # FHIR packages that exist only on the BfArM ZTS (e.g.
      # kbv.all.terminology.allergyintolerance) must be in the package cache
      # before fhir-pkg-tool and SUSHI (inside the Firely action) need them.
      # No-op without ZTS-only dependencies.
      # See docs/workflows.md § FHIR packages from the BfArM ZTS (#55).
      - name: Install ZTS-only FHIR packages
        uses: medizininformatik-initiative/mii-kds-module-template/.github/actions/zts-packages@93f99070b4c5bd4fcb438a368038b0e6eb94049c # mii-kds-module-template dev @ 2026-11-13 (#56)
        with:
          accepted-download-conditions: ${{ inputs.ZTS_ACCEPTED_DOWNLOAD_CONDITIONS }}
          packages: ${{ inputs.ZTS_PACKAGES }}

      # SUSHI (run inside the Firely action below) reads dependencies from the
      # default FHIR package cache. Differential-only packages such as ISiK
      # make it fail with "... is missing a snapshot", so fhir-pkg-tool
      # installs the dependencies with snapshots into that cache first. Same
      # steps and pin as ci_java_validation.yml.
      - name: Install dependencies and generate snapshots (sushi-config.yaml)
        if: ${{ inputs.SNAPSHOT_DEPENDENCIES && hashFiles('sushi-config.yaml') != '' }}
        uses: Gefyra/fhir-pkg-tool@7673ac0d19369660af993cd324d840b312708ffc # v0.5.0
        with:
          sushi-deps-file: sushi-config.yaml

      - name: Install dependencies and generate snapshots (package.json fallback)
        if: ${{ inputs.SNAPSHOT_DEPENDENCIES && hashFiles('sushi-config.yaml') == '' && hashFiles('package.json') != '' }}
        uses: Gefyra/fhir-pkg-tool@7673ac0d19369660af993cd324d840b312708ffc # v0.5.0
        with:
          package-json-file: package.json

      - name: Firely.Terminal (GitHub Actions)
        id: firely-terminal
        uses: FirelyTeam/firely-terminal-pipeline@c9989e48fd369fe07e328f65d706cbc73acbb39d # v0.8.25
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fsh-generated/resources
          PATH_TO_EXAMPLES: fsh-generated/resources
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          DOTNET_VALIDATION_ENABLED: true
          JAVA_VALIDATION_ENABLED: false
          #JAVA_VALIDATION_OPTIONS: -advisor-file advisor.json -resolution-context file:fsh-generated/resources/ -show-message-ids
          SIMPLIFIER_USERNAME: ${{ secrets.SIMPLIFIER_USERNAME }}
          SIMPLIFIER_PASSWORD: ${{ secrets.SIMPLIFIER_PASSWORD }}
          SUSHI_ENABLED: true 
          SUSHI_VERSION: ${{ inputs.SUSHI_VERSION }}
          #JAVA_VALIDATOR_VERSION: 6.10.4
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET #VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA
          #JAVA_SNAPSHOT_ENABLED: true

      - name: Add & Commit
        if: github.event_name == 'pull_request'
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          committer_name: GitHub Actions Bot
          committer_email: ActionBot@github.com
          add: 'fsh-generated/resources/'
          message: auto-generated FHIR files by GitHub Actions (CI FSH to FHIR)
